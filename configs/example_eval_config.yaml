# Config file for evaluation

year: 2022

# Trained model & feature list
# (produced by train.ipynb)
model: "D:/.../model_2022.json"
features: "D:/.../features_2022.json"

# Input data for this year
input_gpkg: "D:/.../EstIP_2022.gpkg"

# Column names in input_gpkg for this year
# (these may change between years)
ags_col: "MUNICIP" # Municipality ID/code
cell_col: "MAPPED_CELLCODE" # Grid cell ID

# Reference/correction table (e.g. population counts per municipality)
# (these can be the same file if population numbers & municipality codes + names are within one file)
reference_file: "D:/.../reference_2022.xlsx"
municipalities_file: "D:/.../municipalities_2022.xlsx"

# Output location
output_dir: "D:/.../validation/"

# Estimation correction/rounding behavior
apply_correction: true # Apply correction factor based on population counts per municipality (set false if not available)
replace_threshold: true # Replace values below threshold with 0
threshold: 0.5 # Threshold value
cell_rounding: true # Round output cell population to whole numbers

# CKM anonymisation parameters
salt_hex: "" # Generated by utils/generate_salt.py
ptable_file: "D:/.../ptable.csv" # Generated in R using ptable package

# test.ipynb input: census reference for this year
census_csv: "D:/.../census_2022.csv"

# analysis.ipynb inputs: ancillary census tables to merge on grid cell ID
# (e.g. area per person, average age, household size, age classes, building age, ...)
ancillary_census_files: [
  "D:/.../census_2022_area_per_person.csv",
  "D:/.../census_2022_average_age.csv",
  "D:/.../census_2022_household_size.csv",
  "D:/.../census_2022_age_classes.csv",
  "D:/.../census_2022_building_age.csv"
]